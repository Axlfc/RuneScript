[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "red-green-refactor-ide"
version = "0.1.0"
description = "TDD IDE with autonomous AI loop"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "colorama>=0.4.6",
    "structlog>=24.0.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
rgr = "src.cli.commands:app"

[tool.setuptools]
packages = {find = {where = ["."], include = ["src*"]}}

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
