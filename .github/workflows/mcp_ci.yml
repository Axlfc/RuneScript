name: RuneScript MCP Server CI

on:
  push:
    branches: [ redgreenrefactor, "jules/*", "agent/*" ]
  pull_request:
    branches: [ redgreenrefactor ]

jobs:
  test-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cognito-stack/mcp-servers/runescript/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run MCP Server & Security Test Suite
        env:
          RUNESCRIPT_PATH: ${{ github.workspace }}
          RUNESCRIPT_ALLOW_DEGRADED_SANDBOX: "true"
          PYTHONPATH: cognito-stack/mcp-servers/runescript
        run: |
          pytest cognito-stack/mcp-servers/runescript/tests/ -v
